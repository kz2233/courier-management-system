name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Tracking mode to write to Confluence
        required: true
        type: choice
        options:
          - SCAN
          - FIX
        default: SCAN
      target_url:
        description: Local application URL to scan
        required: true
        type: string
        default: http://127.0.0.1:8082

jobs:
  build:
    name: Build and analyze
    runs-on: self-hosted
    env:
      SCAN_TARGET_URL: ${{ inputs.target_url || 'http://127.0.0.1:8082' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare security report directory
        run: mkdir -p security-reports

      - name: Semgrep Scan
        continue-on-error: true
        timeout-minutes: 10
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          semgrep_bin="$(command -v semgrep || true)"
          if [ -z "$semgrep_bin" ]; then
            echo '::warning::Semgrep is not installed or not available on PATH.'
            printf '%s\n' '{"errors":["Semgrep executable not found on PATH"],"results":[]}' > security-reports/semgrep-results.json
            exit 0
          fi

          set +e
          /usr/bin/timeout 90s "$semgrep_bin" ci \
            --json \
            --output security-reports/semgrep-results.json
          semgrep_status=$?
          set -e

          if [ "$semgrep_status" -ne 0 ] || [ ! -s security-reports/semgrep-results.json ]; then
            echo "::warning::Semgrep CI did not produce a JSON report; falling back to local Semgrep rules."
            set +e
            /usr/bin/timeout 5m "$semgrep_bin" scan \
              --config p/default \
              --jobs 1 \
              --max-memory 768 \
              --exclude Admin/assets/vendors \
              --exclude fonts \
              --exclude scss/bootstrap \
              --exclude .scannerwork \
              --json \
              --output security-reports/semgrep-results.json \
              .
            fallback_status=$?
            set -e

            if [ "$fallback_status" -ne 0 ] || [ ! -s security-reports/semgrep-results.json ]; then
              echo '{"errors":["Semgrep did not produce a report"],"results":[]}' > security-reports/semgrep-results.json
              echo "::warning::Semgrep fallback failed; wrote an empty JSON report so later scans can continue."
            fi
          fi

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://localhost:9000

      - name: OWASP ZAP Baseline Scan
        if: always()
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/security-reports:/zap/wrk" \
            zaproxy/zap-stable \
            zap-baseline.py \
            -t "$SCAN_TARGET_URL" \
            -J zap-baseline.json \
            -r zap-baseline.html \
            -w zap-baseline.md

      - name: Manual security regression checks
        if: always()
        continue-on-error: true
        env:
          SECURITY_BASE_URL: ${{ inputs.target_url || 'http://127.0.0.1:8082' }}
          SECURITY_TLS_INSECURE: "1"
          SECURITY_TEST_ADMIN_EMAIL: ${{ secrets.SECURITY_TEST_ADMIN_EMAIL }}
          SECURITY_TEST_ADMIN_PASSWORD: ${{ secrets.SECURITY_TEST_ADMIN_PASSWORD }}
        run: python3 .github/security/manual_security_regression.py

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: security-reports/

      - name: Update Confluence vulnerability tracking
        if: always()
        env:
          CONFLUENCE_BASE_URL: https://lukaazhun.atlassian.net
          CONFLUENCE_PAGE_ID: "65975"
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          CONFLUENCE_MODE: ${{ inputs.mode || 'SCAN' }}
        run: python3 .github/security/update_confluence_tracking.py
