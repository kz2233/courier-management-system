name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and analyze
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare security report directory
        run: mkdir -p security-reports

      - name: Semgrep Scan
        continue-on-error: true
        timeout-minutes: 10
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          semgrep_bin="$(command -v semgrep || true)"
          if [ -z "$semgrep_bin" ]; then
            echo '::warning::Semgrep is not installed or not available on PATH.'
            printf '%s\n' '{"errors":["Semgrep executable not found on PATH"],"results":[]}' > security-reports/semgrep-results.json
            exit 0
          fi

          set +e
          /usr/bin/timeout 90s "$semgrep_bin" ci \
            --json \
            --output security-reports/semgrep-results.json
          semgrep_status=$?
          set -e

          if [ "$semgrep_status" -ne 0 ] || [ ! -s security-reports/semgrep-results.json ]; then
            echo "::warning::Semgrep CI did not produce a JSON report; falling back to local Semgrep rules."
            set +e
            /usr/bin/timeout 5m "$semgrep_bin" scan \
              --config p/default \
              --jobs 1 \
              --max-memory 2048 \
              --exclude Admin/assets/vendors \
              --exclude fonts \
              --exclude scss/bootstrap \
              --exclude .scannerwork \
              --json \
              --output security-reports/semgrep-results.json \
              .
            fallback_status=$?
            set -e

            if [ "$fallback_status" -ne 0 ] || [ ! -s security-reports/semgrep-results.json ]; then
              echo '{"errors":["Semgrep did not produce a report"],"results":[]}' > security-reports/semgrep-results.json
              echo "::warning::Semgrep fallback failed; wrote an empty JSON report so later scans can continue."
            fi
          fi

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://localhost:9000

      - name: OWASP ZAP Baseline Scan
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}/security-reports:/zap/wrk" \
            zaproxy/zap-stable \
            zap-baseline.py \
            -t http://127.0.0.1:8082 \
            -J zap-baseline.json \
            -r zap-baseline.html \
            -w zap-baseline.md

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: security-reports/

      - name: Verify Confluence tracking page access
        if: always()
        env:
          CONFLUENCE_BASE_URL: https://lukaazhun.atlassian.net
          CONFLUENCE_PAGE_ID: "65975"
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request

          base_url = os.environ["CONFLUENCE_BASE_URL"].rstrip("/")
          page_id = os.environ["CONFLUENCE_PAGE_ID"]
          email = os.environ.get("CONFLUENCE_EMAIL", "")
          token = os.environ.get("CONFLUENCE_API_TOKEN", "")

          if not email or not token:
              raise SystemExit("Confluence credentials are not available to this job")

          credentials = base64.b64encode(f"{email}:{token}".encode()).decode()
          request = urllib.request.Request(
              f"{base_url}/wiki/rest/api/content/{page_id}?expand=version",
              headers={
                  "Accept": "application/json",
                  "Authorization": f"Basic {credentials}",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  page = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit(f"Confluence page check failed with HTTP {error.code}") from error
          except urllib.error.URLError as error:
              raise SystemExit(f"Confluence page check failed: {error.reason}") from error

          version = page.get("version", {}).get("number", "unknown")
          print(f"Confluence access verified for page {page_id}; current version {version}.")
          PY
